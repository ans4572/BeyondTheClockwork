<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>3장 몹 시안 · 태엽 밖으로</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
  @font-face { font-family: Galmuri11; src: url('../../../../fonts/Galmuri11-sub-v1.woff2') format('woff2'); }
  :root { --ink: #1f2433; --panel: #2b3345; --line: #11151f; --paper: #f6ecd2; --gold: #ffd34d; --dim: #aab3c8; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--paper); font: 14px/1.5 Galmuri11, "Malgun Gothic", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 16px; background: var(--panel); border-bottom: 2px solid var(--line); }
  header h1 { font-size: 17px; margin: 0 12px 0 0; }
  label { display: inline-flex; gap: 6px; align-items: center; color: var(--dim); }
  select, button { font: inherit; color: var(--ink); background: var(--paper); border: 2px solid var(--line); padding: 2px 8px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--gold); }
  main { max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; gap: 18px; }
  .note { color: var(--dim); margin: 0; }
  .card { background: var(--panel); border: 2px solid var(--line); padding: 14px 16px; display: grid; grid-template-columns: 200px 1fr; gap: 14px 20px; }
  .card h2 { margin: 0; font-size: 18px; color: var(--gold); }
  .card .role { color: var(--dim); margin: 2px 0 10px; }
  .front { width: 192px; image-rendering: pixelated; background: var(--stage); border: 2px solid var(--line); }
  .rot { width: 100%; image-rendering: pixelated; background: var(--stage); border: 2px solid var(--line); margin-bottom: 8px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .tabs button small { color: #6b5a2a; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .cell { background: var(--stage); border: 2px solid var(--line); position: relative; }
  .cell canvas { display: block; width: 100%; image-rendering: pixelated; }
  .cell span { position: absolute; left: 4px; top: 2px; font-size: 11px; color: var(--dim); text-shadow: 0 1px 0 #000; }
  .cell.missing { display: grid; place-items: center; color: var(--dim); font-size: 12px; min-height: 80px; }
  .label { color: var(--dim); font-size: 12px; margin: 0 0 4px; }
  @media (max-width: 760px) { .card { grid-template-columns: 1fr; } .grid { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<header>
  <h1>3장 중앙시계탑 몹 시안</h1>
  <label>속도 <input type="range" id="fps" min="2" max="16" value="10"> <span id="fps-text">10</span>프레임/초</label>
  <label>배경 <select id="stage">
    <option value="#4a5266">회청</option>
    <option value="#e9dcc4">대리석(밝음)</option>
    <option value="#262b38">어두움</option>
  </select></label>
  <button id="pause" aria-pressed="false">멈춤</button>
  <label><input type="checkbox" id="step"> 한 프레임씩(←→)</label>
</header>
<main>
  <p class="note">PixelLab에서 만든 그대로입니다. 섬광·연기·베기 궤적과 빨간 옷감 같은 문제는 게임에 넣을 때 가져오기 스크립트가 지우거나 고칩니다(<code>characters.json</code>의 <code>use</code>·<code>drop</code>·<code>recolor</code>). ★ 게임용 = 방향마다 고른 버전을 모은 것(각 칸 위에 어느 버전인지, 좌우 반전이면 그렇게 적힘). v1·v2·v3는 후보 전부. 다시 만들려면 <code>python scripts/build-ch3-mob-preview.py</code>.</p>
</main>
<script>
const DIR_KO = { south: '남(정면)', 'south-east': '남동', east: '동', 'north-east': '북동', north: '북(뒤)', 'north-west': '북서', west: '서', 'south-west': '남서' };
const ANIM_KO = { 'final-attack': '★ 게임용 공격', 'final-move': '★ 게임용 걷기', attack: '공격 v1', 'attack-v2': '공격 v2', 'attack-v3': '공격 v3', move: '걷기 v1', 'move-v2': '걷기 v2', 'move-v3': '걷기 v3' };
const main = document.querySelector('main'), players = [];
let frame = 0, paused = false;

function card(mob) {
  const el = document.createElement('section'); el.className = 'card';
  el.innerHTML = `<div><h2>${mob.name}</h2><p class="role">${mob.role}</p><img class="front" src="${mob.front}" alt="${mob.name} 정면 시안"></div>
    <div><p class="label">8방향 (남 · 남동 · 동 · 북동 · 북 · 북서 · 서 · 남서)</p><img class="rot" src="${mob.rotations.file}" alt="">
    <div class="tabs"></div><div class="grid"></div></div>`;
  const tabs = el.querySelector('.tabs'), grid = el.querySelector('.grid');
  const show = anim => {
    for (const b of tabs.querySelectorAll('button')) b.setAttribute('aria-pressed', b.dataset.anim === anim.name);
    players.splice(0, players.length, ...players.filter(p => p.mob !== mob.key));
    grid.innerHTML = '';
    const image = new Image(); image.src = anim.file;
    for (const dir of ['south', 'south-east', 'east', 'north-east', 'north', 'north-west', 'west', 'south-west']) {
      const cell = document.createElement('div'); cell.className = 'cell';
      if (!anim.dirs.includes(dir)) { cell.classList.add('missing'); cell.textContent = `${DIR_KO[dir]} · 이 버전엔 없음`; grid.append(cell); continue; }
      const canvas = Object.assign(document.createElement('canvas'), { width: anim.cell, height: anim.cell });
      cell.append(canvas); cell.insertAdjacentHTML('beforeend', `<span>${DIR_KO[dir]}${anim.note?.[dir] ? ' · ' + anim.note[dir] : ''}</span>`);
      grid.append(cell);
      players.push({ mob: mob.key, canvas, image, row: anim.dirs.indexOf(dir), count: anim.frames[dir], cell: anim.cell });
    }
    image.onload = draw;
  };
  for (const anim of mob.animations) {
    const b = Object.assign(document.createElement('button'), { innerHTML: ANIM_KO[anim.name] || anim.name });
    b.dataset.anim = anim.name; b.onclick = () => show(anim); tabs.append(b);
  }
  if (!mob.animations.some(a => a.name === 'final-move')) tabs.insertAdjacentHTML('beforeend', '<span class="label">걷기 없음(고정형)</span>');
  main.append(el);
  show(mob.animations[0]);
}

function draw() {
  for (const p of players) {
    if (!p.image.complete) continue;
    const c = p.canvas.getContext('2d'), f = frame % p.count;
    c.clearRect(0, 0, p.cell, p.cell);
    c.drawImage(p.image, f * p.cell, p.row * p.cell, p.cell, p.cell, 0, 0, p.cell, p.cell);
  }
}
let last = 0;
function tick(now) {
  const fps = Number(document.getElementById('fps').value);
  if (!paused && !document.getElementById('step').checked && now - last >= 1000 / fps) { frame++; last = now; draw(); }
  requestAnimationFrame(tick);
}
document.getElementById('fps').oninput = e => { document.getElementById('fps-text').textContent = e.target.value; };
document.getElementById('stage').onchange = e => document.documentElement.style.setProperty('--stage', e.target.value);
document.documentElement.style.setProperty('--stage', '#4a5266');
document.getElementById('pause').onclick = e => { paused = !paused; e.target.setAttribute('aria-pressed', paused); e.target.textContent = paused ? '재생' : '멈춤'; };
addEventListener('keydown', e => { if (!document.getElementById('step').checked) return; if (e.key === 'ArrowRight') frame++; else if (e.key === 'ArrowLeft') frame = Math.max(0, frame - 1); else return; draw(); });
fetch('data.json').then(r => r.json()).then(list => { list.forEach(card); requestAnimationFrame(tick); });
</script>
</body>
</html>
