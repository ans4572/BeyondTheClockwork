<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>태엽 밖으로 · 3장 효과음·이펙트 시안</title>
<style>
  @font-face { font-family: 'Galmuri11'; src: url('../../../fonts/Galmuri11-sub-v1.woff2') format('woff2'); font-weight: 100 599; }
  @font-face { font-family: 'Galmuri11'; src: url('../../../fonts/Galmuri11-Bold-sub-v1.woff2') format('woff2'); font-weight: 600 900; }
  @font-face { font-family: 'Galmuri11 Rest'; src: url('../../../fonts/Galmuri11-rest-v1.woff2') format('woff2'); font-weight: 100 599; unicode-range: U+AC00-D7A3; }
  @font-face { font-family: 'Galmuri11 Rest'; src: url('../../../fonts/Galmuri11-Bold-rest-v1.woff2') format('woff2'); font-weight: 600 900; unicode-range: U+AC00-D7A3; }
  :root { --ink: #2b3345; --paper: #f6ecd2; --low: #ece0c0; --gold: #ffd257; --label: #5d6476; --red: #a92f2b; --cyan: #1f6f86; }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; background: var(--paper); color: var(--ink); font: 15px/1.5 "Galmuri11", "Galmuri11 Rest", "Malgun Gothic", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; padding: max(12px, env(safe-area-inset-top)) 16px 12px; background: var(--ink); color: var(--paper); }
  h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header p { margin: 2px 0 0; font-size: 12px; opacity: .85; }
  main { max-width: 980px; margin: 0 auto; padding: 8px 12px 48px; }
  h2 { margin: 26px 4px 8px; font-size: 16px; font-weight: 700; border-bottom: 3px solid var(--ink); padding-bottom: 4px; }
  h3 { margin: 16px 4px 6px; font-size: 14px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(290px, 100%), 1fr)); gap: 6px; }
  li button { display: grid; grid-template-columns: 44px 1fr; gap: 0 10px; align-items: center; width: 100%; min-height: 56px; padding: 8px 10px; border: 0; background: var(--low); box-shadow: inset 0 -3px 0 rgba(43, 51, 69, .18); color: inherit; font: inherit; text-align: left; cursor: pointer; }
  li button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .no { grid-row: span 2; font-size: 16px; font-weight: 700; color: var(--red); }
  .name { font-weight: 700; }
  .when { font-size: 12px; color: var(--label); }
  button.playing { background: var(--gold); }
  /* Each sound: the coded one, and beside it the Openverse recording picked for it. */
  li { display: grid; grid-template-columns: 1fr 76px; gap: 3px; }
  li button.ov { grid-template-columns: 1fr; gap: 0; justify-items: center; text-align: center; padding: 6px 4px; background: #dfe7e3; }
  li button.ov .tag { font-size: 12px; font-weight: 700; color: var(--cyan); }
  li button.ov .fit { font-size: 11px; color: var(--label); }
  li button.ov.playing { background: var(--gold); }
  li button[disabled] { opacity: .45; cursor: default; }
  .credits { font-size: 12px; color: var(--label); margin: 4px; padding: 0 0 0 18px; }
  .credits li { display: list-item; margin: 2px 0; }
  .credits a { color: var(--cyan); }
  .shots { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(440px, 100%), 1fr)); gap: 12px; }
  figure { margin: 0; background: var(--low); padding: 8px; }
  figure img { display: block; width: 100%; height: auto; image-rendering: pixelated; }
  figcaption { font-size: 13px; padding: 6px 2px 0; }
  figcaption b { color: var(--red); margin-right: 6px; }
  .note { font-size: 13px; color: var(--label); margin: 4px; }
  /* Phones: one column, a little tighter, buttons still a thumb high. */
  @media (max-width: 560px) {
    header { position: static; }
    main { padding: 4px 8px 40px; }
    h1 { font-size: 16px; }
    h2 { margin-top: 20px; }
    .shots { gap: 8px; }
    figure { padding: 6px; }
  }
</style>
</head>
<body>
<header><h1>3장 효과음·이펙트 시안</h1><p id="status">소리 버튼을 누르면 게임과 같은 음량으로 한 번 재생됩니다. 오른쪽 '녹음'은 Openverse의 자유 라이선스 녹음에서 고른 같은 소리입니다(같은 음량으로 맞춤). 바꾸고 싶은 것은 번호로 알려 주세요 (예: S3, B12 녹음, E2). 아이폰은 무음 모드를 끄면 들립니다.</p></header>
<main>
  <h2>이펙트 (게임 화면 캡처)</h2>
  <div class="shots">
    <figure><img src="orders-charge.jpg" alt=""><figcaption><b>E1</b>가짜 명령: 기둥 위 조율 바늘과 눈금판(초록이 맞는 음), 벨가드 머리 위 금 간 종, 돌진 경로와 먼지</figcaption></figure>
    <figure><img src="orders-crack.jpg" alt=""><figcaption><b>E2</b>가짜 명령 기둥을 내려친 순간: 기둥 파편, 종에 금, 상단 '가짜 명령 2/3'</figcaption></figure>
    <figure><img src="resonance-hum.jpg" alt=""><figcaption><b>E3</b>공명 기둥: 울리는 두 기둥 사이 청록 떨림선과 붉은 범위, 삼각형 안쪽 경고</figcaption></figure>
    <figure><img src="resonance-blast.jpg" alt=""><figcaption><b>E4</b>공명선이 터지는 순간의 청백색 섬광(새로 추가)</figcaption></figure>
    <figure><img src="combo3-lunge.jpg" alt=""><figcaption><b>E5</b>벨가드 3타: 돌진 경로(밝은 띠)와 도착 지점의 170도 범위</figcaption></figure>
    <figure><img src="ticktock-dais.jpg" alt=""><figcaption><b>E6</b>틱·톡 색깔 바닥: 쌍둥이가 선 칸이 회색 단(금 테두리)</figcaption></figure>
    <figure><img src="metronome-dashed.jpg" alt=""><figcaption><b>E7</b>큰 메트로놈: 다음 휘두름 범위가 점선만(빨간 실선 제거)</figcaption></figure>
  </div>
  <p class="note">캡처에 없는 이펙트: 틱·톡이 반 박자 일찍 공격할 때 머리 위 금빛 반짝임, 2페이즈 큰 메트로놈 동안 던지는 톱니의 반짝임, 음 이탈 때 기둥 흔들림.</p>
  <div id="list"></div>
</main>
<script type="module">
// A fresh query on every visit, so the newest recipes always load.
const { SFX, SoundBank } = await import(`../../../../src/audio/sfx.js?t=${Date.now()}`);
// Openverse recordings (openverse/manifest.json): each was levelled to loud, and target is the coded sound's level in
// the game, so playing at target / loud sits where the coded one does.
const OV = await fetch(`openverse/manifest.json?t=${Date.now()}`).then(r => r.ok ? r.json() : {}).catch(() => ({}));
const FIT = { strong: '아주 비슷', plausible: '비슷', weak: '조금 비슷', 'no match': '다름' };

// Every chapter 3 sound, numbered for requests: S ordinary enemies, T Tick·Tock, B Belgard, R chapter 2 for comparison.
const GROUPS = [
  ['S', '3장 일반 몹 (공격할 때)', [
    ['secondHandKnight', '초침 기사', '초침 반바퀴 휘두름 + 째깍'],
    ['bellTurret', '종 탄환 포탑', '종 탄환을 쏠 때'],
    ['signalOrb', '신호 구체', '신호 박동을 보낼 때'],
    ['hourglassShield', '모래시계 방패병', '방패로 칠 때 (모래 소리)'],
    ['minuteArcher', '분침 궁수', '활을 쏠 때 (벨가드가 부르는 궁수도 같음)'],
    ['pendulumGuard', '진자 경비', '진자를 휘두를 때'],
    ['gearRoller', '톱니 굴림이', '굴러서 돌진할 때'],
    ['twinHandCaptain', '쌍침 대장', '두 바늘로 연속 휘두를 때']
  ]],
  ['T', '시간지기 틱·톡', [
    ['boss-ttBeatTick', '박자: 틱', '빨강의 박자마다 (작게)'],
    ['boss-ttBeatTock', '박자: 톡', '파랑의 박자마다 (작게)'],
    ['boss-ttThrust', '찌르기 1·2타', '틱의 찌르기'],
    ['boss-ttThrust3', '찌르기 3타', '틱의 마지막 찌르기'],
    ['boss-ttSweep', '분침 휘두르기', '톡의 반원 휘두르기와 톱니 세 개'],
    ['boss-ttDash', '태엽 돌진', '틱의 돌진'],
    ['boss-ttPendulumBlast', '진자 바닥 폭발', '진자 패턴의 한쪽 바닥이 터질 때마다'],
    ['boss-ttShuffleBurst', '야바위 폭탄', '태엽 열쇠 단 쪽이 터질 때'],
    ['boss-ttBladeSwing', '큰 메트로놈 휘두름', '2페이즈 회중시계가 한 번 휘두를 때마다'],
    ['boss-ttGearThrow', '톱니 던지기', '큰 메트로놈 중 2박자마다 (작게)'],
    ['boss-ttEchoBlow', '메아리 폭발', '발자국 표시가 터질 때'],
    ['boss-ttPincerClose', '집게 닫힘', '집게 고리가 가운데로 닫힐 때'],
    ['boss-ttBlinkIn', '순간이동 등장', '양쪽 끝으로 나타날 때 (작게)'],
    ['boss-ttFlankWall', '톱니 벽', '톱니 벽을 보낼 때마다'],
    ['boss-ttTwist', '색깔 칸 다시 바뀜', '색깔 바닥이 막판에 한 번 더 바뀔 때 (작게)'],
    ['boss-ttColourTick', '색깔 바닥: 빨강', '틱 자세가 끝나 파란 칸이 터질 때'],
    ['boss-ttColourTock', '색깔 바닥: 파랑', '톡 자세가 끝나 빨간 칸이 터질 때']
  ]],
  ['B', '종루수호자 벨가드', [
    ['boss-bgCombo', '대검 베기 1·2타', '연속 베기'],
    ['boss-bgCombo3', '돌진 내려베기 (3타)', '크게 돌진하는 3타'],
    ['boss-bgSpin', '회전 베기', '가까이 붙었을 때'],
    ['boss-bgSlam', '대검 내려찍기', '내려찍기, 가짜 명령 파훼의 내려치기'],
    ['boss-bgCracks', '바닥 균열', '균열 세 줄'],
    ['boss-bgGrab', '움켜쥐기', '건틀릿으로 잡을 때'],
    ['boss-bgPunch', '맨주먹', '검이 날아가 있는 동안'],
    ['boss-bgToll', '가슴 종 울림', '세 고리 종소리, 마지막 종소리의 한 번 한 번'],
    ['boss-bgCage', '종 가두기 종소리', '종 가두기 명령'],
    ['boss-bgCageLand', '종 내려앉음', '종이 바닥에 닿을 때'],
    ['boss-bgArchers', '궁수 호출', '분침 궁수를 부를 때'],
    ['boss-bgFlySword', '환영검', '2페이즈 환영검이 날아오를 때'],
    ['boss-bgSwordRain', '검비', '작은 검이 줄지어 떨어질 때'],
    ['boss-bgNeedles', '조율 바늘', '바늘 네 개가 꽂힐 때'],
    ['boss-bgLastToll', '마지막 종소리 준비', '환영검을 꽂을 때'],
    ['boss-bgResonance', '공명 기둥 솟음', '공명 기둥 패턴 시작'],
    ['boss-bgOrder', '오르덴의 명령', '진짜 명령이 기둥에 내려올 때'],
    ['boss-bgForge', '가짜 명령 성공', '바늘이 가운데일 때 기둥을 친 순간'],
    ['boss-bgClang', '음 이탈', '바늘이 벗어났을 때 친 순간'],
    ['boss-bgCharge', '갑옷 돌진', '명령받은 기둥으로 달려갈 때'],
    ['boss-bgCrack', '종에 금', '가짜 명령 기둥을 내려쳐 금이 갈 때']
  ]],
  ['R', '비교용 2장 소리', [
    ['pressGuard', '압축 경비 (2장 몹)', '음량 비교용'],
    ['boss-armSlam', '프레스 팔 내려찍기 (2장 보스)', '음량 비교용'],
    ['boss-rhythmBeat', '프레스 박자 (2장 보스)', '음량 비교용']
  ]]
];

document.getElementById('list').innerHTML = GROUPS.map(([letter, title, items]) => `<h2>${letter} · ${title}</h2><ol>${items.map(([id, name, when], i) =>
  `<li><button data-id="${id}"${SFX[id] ? '' : ' disabled'}><span class="no">${letter}${i + 1}</span><span class="name">${name}</span><span class="when">${when}</span></button>${letter === 'R' ? '<span></span>' : OV[id]
    ? `<button class="ov" data-ov="${id}" aria-label="${letter}${i + 1} 녹음"><span class="tag">녹음</span><span class="fit">${FIT[OV[id].verdict] ?? ''}</span></button>`
    : '<button class="ov" disabled><span class="tag">녹음</span><span class="fit">없음</span></button>'}</li>`).join('')}</ol>`).join('')
  + `<h2>녹음 출처 (Openverse)</h2><p class="note">녹음은 Openverse에서 CC0·CC BY 녹음만 찾아 잘라 쓴 것입니다. '아주 비슷/비슷/조금 비슷'은 소리 판별 모델이 소리 설명과 얼마나 맞는다고 본 정도입니다.</p><ol class="credits">${
    GROUPS.flatMap(([letter, , items]) => items.map(([id, name], i) => OV[id] && `<li>${letter}${i + 1} ${name}: <a href="${OV[id].landing}" target="_blank" rel="noopener">${OV[id].title}</a>, ${OV[id].creator ?? '작자 미상'}, <a href="${OV[id].license_url}" target="_blank" rel="noopener">${OV[id].license.toUpperCase()} ${OV[id].license_version ?? ''}</a> (${OV[id].provider})</li>`)).filter(Boolean).join('')}</ol>`;

let audio = null; const bank = new SoundBank();
document.getElementById('list').addEventListener('click', async e => {
  const button = e.target.closest('button[data-id], button[data-ov]'); if (!button) return;
  audio ??= new AudioContext(); await audio.resume();
  if (button.dataset.ov) playRecording(button.dataset.ov); else bank.play(audio, button.dataset.id);
  button.classList.add('playing'); setTimeout(() => button.classList.remove('playing'), 400);
});
const recordings = {};
async function playRecording(id) {
  const take = OV[id];
  recordings[id] ??= fetch(`openverse/${take.file}`).then(r => r.arrayBuffer()).then(bytes => audio.decodeAudioData(bytes));
  const source = audio.createBufferSource(), gain = audio.createGain();
  source.buffer = await recordings[id]; gain.gain.value = (take.target ?? 0.05) / take.loud;
  source.connect(gain).connect(audio.destination); source.start();
}
</script>
</body>
</html>
