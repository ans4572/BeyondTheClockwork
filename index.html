  <!-- Shown by the HTML alone, before any script, style sheet or font arrives; removed once the title is drawn. -->
  <style>
    body:not(.booted) #app, body:not(.booted) #title { visibility: hidden; }
    #boot { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: repeating-linear-gradient(0deg, #3d6a63 0 24px, #35605a 24px 26px); font-family: "Galmuri11", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; }
    #boot .card { padding: 22px 34px; background: #f6ecd2; color: #2b3345; text-align: center; box-shadow: 8px 8px 0 #0e121a80; }
    #boot b { display: block; font-size: 30px; letter-spacing: 2px; }
    #boot span { display: block; margin-top: 10px; font-size: 13px; color: #5d6476; }
    #boot i { display: inline-block; margin-right: 6px; font-style: normal; animation: boot-turn 1.6s linear infinite; }
    @keyframes boot-turn { to { transform: rotate(360deg); } }
    #boot.tap { cursor: pointer; }
    #boot.tap i { display: none; }
    #boot.tap span { color: #2b3345; font-weight: 700; animation: boot-blink 1.2s ease-in-out infinite; }
    @keyframes boot-blink { 50% { opacity: .35; } }
    @media (prefers-reduced-motion: reduce) { #boot i, #boot.tap span { animation: none; } }
  </style>

  <div id="boot" role="status"><div class="card"><b>태엽 밖으로</b><span><i>⚙</i>태엽을 감는 중…</span></div></div>
  <main id="app">
    <div class="viewport">
      <canvas id="game" width="640" height="366" tabindex="0" aria-label="WASD 이동, 마우스 조준, 좌클릭 공격, Space 회피"></canvas>
      <canvas id="letters" aria-hidden="true"></canvas>
      <div id="scene" hidden></div>
      <div id="boss-card" hidden></div>
      <div id="wipe" hidden></div>
      <div id="hud">
        <div class="hud-tag hud-vitals"><canvas id="hud-face" width="56" height="56"></canvas><div class="hud-bars"><div class="hud-bar"><i id="hp-fill"></i><b id="hp-text"></b></div><div class="hud-bar energy"><i id="energy-fill"></i><b id="energy-text"></b></div></div></div>
        <canvas id="minimap" class="hud-minimap" width="336" height="224" aria-label="미니맵" hidden></canvas>
        <div id="boss-bar" class="hud-boss" hidden><b id="boss-name"></b><div class="boss-track"><i id="boss-fill"></i><span id="boss-marks"></span></div><small id="boss-note"></small></div>
        <div class="hud-tag hud-wallet"><span title="자유 톱니" data-icon="gear"><b id="gears">0</b></span><span title="동전" data-icon="coin"><b id="coins">0</b></span></div>
        <button id="practice-reset" class="hud-tag" hidden></button>
        <div class="hud-tools"><button id="fullscreen" class="hud-tag" aria-label="게임 전체화면"></button><button id="hud-map" class="hud-tag" aria-label="지도"></button><button id="hud-menu" class="hud-tag" aria-label="환경설정"></button></div>
        <div id="skills"></div>
        <div id="skill-tip" role="tooltip" hidden></div>
        <div id="dialogue" hidden></div>
      </div>
      <div id="toast" role="status"></div><div id="hint" role="status" hidden></div><div id="overlay"></div>
    </div>
    <div id="touch" hidden></div>
  </main>
  <div id="title" hidden></div>
  <div id="rotate">폰을 가로로 돌려 주세요</div>
