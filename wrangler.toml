# Cloudflare Workers: the game is plain files served from the repository root, with no build step.
# A small worker (worker/index.js) answers /api/* — the device-transfer codes — and hands every other path to the files.
name = "beyondtheclockwork"
compatibility_date = "2026-11-01"
main = "worker/index.js"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# Where transfer codes live for five minutes (KV namespace "beyondtheclockwork-transfer", see DEPLOY.md).
[[kv_namespaces]]
binding = "TRANSFER"
id = "14a074391973456198e9fde6245692c3"

# Play statistics for the admin page (worker/stats.js, admin.html): D1 database "beyondtheclockwork-stats", see DEPLOY.md.
[[d1_databases]]
binding = "STATS"
database_name = "beyondtheclockwork-stats"
database_id = "c3d806a7-495b-4d79-98cb-44ad9a4bb16e"
