# Cloudflare Workers: the game is plain files served from the repository root, with no build step.
# A small worker (worker/index.js) answers /api/* — the device-transfer codes — and hands every other path to the files.
name = "beyondtheclockwork"
compatibility_date = "2026-11-01"
main = "worker/index.js"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/api/*"]

# Where transfer codes live for five minutes (KV namespace "beyondtheclockwork-transfer", see DEPLOY.md).
[[kv_namespaces]]
binding = "TRANSFER"
id = "14a074391973456198e9fde6245692c3"
