<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>태엽 밖으로 · 효과음 목록</title>
<style>
  @font-face { font-family: 'Galmuri11'; src: url('art/fonts/Galmuri11-sub-v1.woff2') format('woff2'); font-weight: 100 599; }
  @font-face { font-family: 'Galmuri11'; src: url('art/fonts/Galmuri11-Bold-sub-v1.woff2') format('woff2'); font-weight: 600 900; }
  :root { --ink: #2b3345; --paper: #f6ecd2; --low: #ece0c0; --gold: #ffd257; --label: #5d6476; --red: #a92f2b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 "Galmuri11", "Malgun Gothic", system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 1; padding: 12px 16px; background: var(--ink); color: var(--paper); }
  h1 { margin: 0; font-size: 18px; font-weight: 700; }
  header p { margin: 2px 0 0; font-size: 12px; opacity: .85; }
  main { max-width: 760px; margin: 0 auto; padding: 8px 12px 48px; }
  h2 { margin: 22px 4px 8px; font-size: 15px; font-weight: 700; border-bottom: 3px solid var(--ink); padding-bottom: 4px; }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  li button { display: grid; grid-template-columns: 52px 1fr auto; gap: 2px 12px; align-items: center; width: 100%; min-height: 56px; padding: 8px 12px; border: 0; background: var(--low); box-shadow: inset 0 0 0 2px var(--ink); color: var(--ink); font: inherit; text-align: left; cursor: pointer; touch-action: manipulation; }
  li button:focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }
  .no { grid-row: span 2; font-size: 18px; font-weight: 700; color: var(--red); }
  .name { font-weight: 700; }
  .kind { grid-row: span 2; font-size: 11px; padding: 1px 6px; background: var(--paper); box-shadow: inset 0 0 0 1px var(--label); color: var(--label); white-space: nowrap; }
  .when { font-size: 12px; color: var(--label); }
  button.playing { background: var(--gold); }
</style>
</head>
<body>
<header><h1>효과음 목록 · 지금 게임에 들어 있는 소리</h1><p id="status">누르면 게임과 같은 음량·높낮이로 한 번 재생됩니다. 바꾸고 싶은 소리는 번호로 알려 주세요 (예: A3, D5).</p></header>
<main id="list"></main>
<script>
// Phones keep this page for up to ten minutes. It asks the server for its own latest copy and, if that copy is newer,
// reloads under a fresh address so the new list shows at once. Bump PAGE_VERSION whenever the list changes.
const PAGE_VERSION = '2026-11-09-mob2';
fetch(`${location.pathname}?check=${Date.now()}`, { cache: 'no-store' }).then(r => r.text()).then(text => {
  const latest = text.match(/PAGE_VERSION = '([^']+)'/)?.[1];
  if (latest && latest !== PAGE_VERSION && !location.search.includes(latest)) location.replace(`${location.pathname}?v=${latest}`);
}).catch(() => {});
</script>

    ['boss-verdict', '아이리스 · 검수 판정', '판정이 내려올 때'], ['boss-tapeMeasure', '아이리스 · 줄자', '줄자를 쏠 때'], ['boss-decoysAppear', '아이리스 · 분신 등장', '셋이 나타날 때'],

    ['boss-craneDrop', '프레스 · 크레인 집게', '그림자가 멈추고 집게가 내려올 때'], ['boss-twoRows', '프레스 · 두 줄 압착'], ['boss-wallSqueeze', '프레스 · 양벽 압축'], ['boss-rhythmBeat', '프레스 · 박자 압착', '박자마다'],
    ['boss-twinSlam', '프레스 · 쌍둥이 피스톤', '피스톤이 내려찍을 때마다'], ['boss-steamBurst', '프레스 · 증기 분출'], ['boss-finalAlarm', '프레스 · 마무리 압축 경보', '마지막 1초'], ['boss-finalPress', '프레스 · 마무리 압축', '내려찍을 때'],
    ['boss-moldOk', '프레스 · 규격 틀 일치'], ['boss-moldNo', '프레스 · 규격 틀 불일치']
  ].map(([id, name, when]) => [id, name, when || '패턴이 나갈 때'])],
  ['D', '적', [
    ['tell', '공격 예고', '일반 몹이 공격 준비를 시작할 때 (모든 몹 공통)'],

    ['summon', '웨이브 등장', '다음 무리가 나타날 때'],
    ['kill', '처치', '적을 쓰러뜨렸을 때']

    ['pressCaptain', '압축 경비대장 · 돌진', '돌진할 때 (두 번)'],

    ['riveter', '리벳 사수 · 리벳 발사', '리벳 세 발을 쏠 때'],
    ['tapePacker', '테이프 포장공 · 돌진', '테이프를 깔며 돌진할 때'],
    ['oiler', '기름칠공 · 기름통 던지기', '기름통을 던질 때'],
    ['partsSupplier', '부품 보급공 · 놋쇠판 보급', '동료에게 놋쇠판을 줄 때']

    ['boss-overcharge', '로코 · 과충전 폭발', '터질 때'], ['boss-stickers', '로코 · 불량 딱지', '딱지를 던질 때'], ['boss-crane', '로코 · 크레인 낙하', '상자가 떨어질 때'],
    ['bell', '브라스 · 정지의 종 (마을 종과 같음)', '마을 표정 검사 종, 브라스의 정지의 종'],

  ]]

// Skill and fusion names come from the game data, so the list never drifts from what the game calls them.
const combat = await (await fetch(`./src/data/combat.json?t=${Date.now()}`)).json(), ELEMENT = Object.fromEntries(combat.elements.map(e => [e.id, e.name]));
for (const [, , items] of GROUPS) for (const item of items) {
  const skill = combat.skills.find(s => s.id === item[0]), fusion = combat.fusions.find(f => f.id === item[0]);
  if (skill) item[1] = `${ELEMENT[skill.element]} · ${skill.name}`;
  if (fusion) item[1] = `${fusion.pair.map(id => ELEMENT[id]).join('+')} · ${fusion.name}`;
}
const KIND = id => SFX[id]?.synth || SFX[id]?.code ? '코드로 만든 소리' : '녹음';

const listed = new Set(GROUPS.flatMap(([, , items]) => items.map(([id]) => id)));
const missing = Object.keys(SFX).filter(id => !listed.has(id));
if (missing.length) console.warn('목록에 없는 효과음:', missing);

document.getElementById('list').innerHTML = GROUPS.map(([letter, title, items]) => `<h2>${letter} · ${title}</h2><ol>${items.map(([id, name, when], i) =>
  `<li><button data-id="${id}"><span class="no">${letter}${i + 1}</span><span class="name">${name}</span><span class="kind">${KIND(id)}</span><span class="when">${when}</span></button></li>`).join('')}</ol>`).join('');

let audio = null; const bank = new SoundBank();
document.getElementById('list').addEventListener('click', async e => {
  const button = e.target.closest('button[data-id]'); if (!button) return;
  audio ??= new AudioContext(); await audio.resume();
  document.getElementById('status').textContent = '소리를 불러오는 중…';
  await bank.load(audio);
  document.getElementById('status').textContent = '누르면 게임과 같은 음량·높낮이로 한 번 재생됩니다. 바꾸고 싶은 소리는 번호로 알려 주세요 (예: A3, D5).';
  bank.play(audio, button.dataset.id);
  button.classList.add('playing'); setTimeout(() => button.classList.remove('playing'), 400);
});
</script>
</body>
</html>
