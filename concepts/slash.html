<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>렌치 베기 이펙트 시안</title><style>
body{margin:0;background:#2b3345;font-family:"Malgun Gothic",sans-serif;color:#f6ecd2}#sheet{max-width:1600px;margin:0 auto;padding:20px;box-sizing:border-box}
h1{margin:0 0 4px;font-size:24px}p.sub{margin:0 0 14px;color:#c9c2ad;font-size:14px}
.row{display:grid;overflow-x:auto;grid-template-columns:240px 1.4fr repeat(4,1fr);gap:8px;margin-bottom:12px;align-items:center}
.label b{display:block;font-size:17px;color:#ffd257}.label span{font-size:12.5px;line-height:1.45;color:#e6dcc0}
canvas{width:100%;min-width:0;image-rendering:pixelated;background:#e9d9b4;box-shadow:inset 0 0 0 2px #0e121a}
.head{font-size:12px;color:#c9c2ad;text-align:center}
</style></head><body><div id="sheet"><h1>렌치 베기 이펙트 시안 · 얇은 버전</h1><p class="sub">왼쪽 큰 칸은 실제 속도(0.3초)로 반복 재생되고, 1타·2타처럼 방향을 번갈아 휘두릅니다. 모두 청록 · 반짝임 없음 · 칸마다 휘두르는 진행 순서(시작 → 끝). 같은 바닥과 캐릭터 위치 기준, 실제 게임과 같은 640 픽셀 격자로 그렸습니다.</p><div id="rows"></div></div>
<script>
const TAU = Math.PI * 2, TEAL = '#7fe0d4', DARK = '#3fb8a8', INK = '#2b3345';
const floor = new Image(); floor.src = 'slash-floor.png';
// Each concept: draw(c, x, y, R, angle, dir, t) where t runs 0..1 over the swing.
const CONCEPTS = [
  ['지금 (픽셀 쐐기)', '시작·중간·끝 3장의 청록 쐐기.', (c, x, y, R, a, d, t) => smear(c, x, y, R, a, d, t)],
  ['E · 한 줄 초승달', '액션 RPG에서 가장 흔한 방식. 가는 호 하나가 머리에서 꼬리로 가늘어지며 지나감(최대 3픽셀).', (c, x, y, R, a, d, t) => thinArc(c, x, y, R, a, d, t, [[1, 3]])],
  ['F · 두 줄 평행선', '도트 액션 게임에서 자주 보는 방식. 얇은 호 2줄이 나란히 지나감(2·1픽셀).', (c, x, y, R, a, d, t) => thinArc(c, x, y, R, a, d, t, [[1, 2], [0.82, 1]])],
  ['G · 끊어진 잔상선', '빠른 검격 느낌. 얇은 호가 짧은 조각으로 끊겨 남고 바로 사라짐.', (c, x, y, R, a, d, t) => thinArc(c, x, y, R, a, d, t, [[1, 2]], true)],
  ['H · 1픽셀 궤적 + 끝 꺾임', '가장 얇음. 1픽셀 호와, 끝에서 짧게 튕기는 2줄. 레트로 로그라이트 느낌.', (c, x, y, R, a, d, t) => { thinArc(c, x, y, R, a, d, t, [[1, 1]]); flick(c, x, y, R, a, d, t); }]
];
const SWEEP = 0.45, SPAN = 1;
function frameOf(t) { return { grow: Math.min(1, t / SWEEP), fade: t < SWEEP ? 1 : 1 - (t - SWEEP) / (1 - SWEEP) }; }
const at = (x, y, ang, r) => [x + Math.cos(ang) * r, y + Math.sin(ang) * r];
function crescent(c, x, y, R, a, d, t, o) {
  const { grow, fade } = frameOf(t), start = a - d * SPAN, sweep = d * 2 * SPAN * grow, thick = R * o.thick, n = 14;
  c.save(); c.globalAlpha = fade; c.beginPath();
  for (let i = 0; i <= n; i++) c.lineTo(...at(x, y, start + sweep * i / n, R));
  for (let i = n; i >= 0; i--) { const k = i / n; c.lineTo(...at(x, y, start + sweep * k, R - thick * (0.25 + 0.75 * Math.pow(k, 0.8)))); }
  c.closePath(); c.fillStyle = TEAL; c.globalAlpha = fade * (o.fill ?? 0.85); c.fill();
  if (o.outline) { c.globalAlpha = fade; c.strokeStyle = DARK; c.lineWidth = 2; c.beginPath(); for (let i = 0; i <= n; i++) c.lineTo(...at(x, y, start + sweep * i / n, R)); c.stroke(); }
  else { c.strokeStyle = INK; c.lineWidth = 1; c.globalAlpha = fade * 0.45; c.stroke(); }
  if (o.edge) { c.globalAlpha = fade; c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); for (let i = n / 2; i <= n; i++) c.lineTo(...at(x, y, start + sweep * i / n, R - 1)); c.stroke(); }
  if (o.lines) { const h = start + sweep; c.strokeStyle = DARK; c.lineWidth = 1.5; for (const [r, b] of [[R * 0.62, 0.35], [R * 0.8, 0.5], [R * 1.1, 0.28]]) { c.beginPath(); c.moveTo(...at(x, y, h - d * b, r)); c.lineTo(...at(x, y, h - d * 0.08, r)); c.stroke(); } }
  c.restore();
}
function smear(c, x, y, R, a, d, t) {
  // Three hard-edged wedges of the swing (start, middle, end), each held two frames; no soft fade, pixel steps only.
  const keys = [-0.75, 0, 0.75];
  c.save(); c.imageSmoothingEnabled = false;
  keys.forEach((k, i) => {
    const on = t * 3.2 - i; if (on < 0 || on > 1.3) return;
    const mid = a + d * k, half = 0.42, inner = R * 0.45;
    c.fillStyle = on > 0.9 ? DARK : TEAL; c.globalAlpha = on > 0.9 ? 0.6 : 1;
    for (let r = Math.round(inner); r <= R; r += 2) { const w = half * (r - inner) / (R - inner); for (let ang = mid - w; ang <= mid + w; ang += 1.6 / r) { const [px, py] = at(x, y, ang, r); c.fillRect(Math.round(px), Math.round(py), 2, 2); } }
    c.fillStyle = '#ffffff'; c.globalAlpha = on > 0.9 ? 0 : 1; for (let ang = mid - half; ang <= mid + half; ang += 1.6 / R) { const [px, py] = at(x, y, ang, R); c.fillRect(Math.round(px), Math.round(py), 2, 2); }
  });
  c.restore();
}
function thinArc(c, x, y, R, a, d, t, bands, broken) {
  const { grow, fade } = frameOf(t), start = a - d * SPAN, sweep = d * 2 * SPAN * grow, n = 18;
  c.save(); c.lineCap = 'butt';
  for (const [k, w] of bands) for (let i = 0; i < n; i++) {
    if (broken && i % 3 === 2) continue;
    const k0 = i / n, k1 = (i + 1) / n; c.globalAlpha = fade * (0.25 + 0.75 * k1);
    const lw = Math.max(1, w * (0.35 + 0.65 * k1)), a0 = start + sweep * k0, a1 = start + sweep * k1 + d * 0.001;
    // A one-pixel ink shadow just outside the stroke keeps a thin line readable on pale floors.
    c.strokeStyle = '#2b3345'; c.lineWidth = 1; c.globalAlpha = fade * 0.55 * k1; c.beginPath(); c.arc(x, y, R * k + lw / 2 + 0.6, a0, a1, d < 0); c.stroke();
    c.globalAlpha = fade * (0.35 + 0.65 * k1); c.strokeStyle = k1 > 0.8 ? '#e9fffb' : '#2fb8a6'; c.lineWidth = lw;
    c.beginPath(); c.arc(x, y, R * k, a0, a1, d < 0); c.stroke();
  }
  c.restore();
}
function flick(c, x, y, R, a, d, t) {
  const { grow, fade } = frameOf(t); if (grow < 1 || fade <= 0) return;
  const head = a + d * SPAN, [hx, hy] = at(x, y, head, R);
  c.save(); c.globalAlpha = fade; c.strokeStyle = '#2b3345'; c.lineWidth = 1;
  for (const off of [0.5, -0.5]) { c.beginPath(); c.moveTo(hx, hy); c.lineTo(hx + Math.cos(head + d * 1.2 + off) * 6, hy + Math.sin(head + d * 1.2 + off) * 6); c.stroke(); }
  c.restore();
}
function strands(c, x, y, R, a, d, t) {
  const { grow, fade } = frameOf(t), start = a - d * SPAN, head = start + d * 2 * SPAN * grow;
  c.save(); c.lineCap = 'round';
  [[R, 4, 1.3], [R * 0.84, 3, 1.0], [R * 0.68, 2, 0.7]].forEach(([r, w, len]) => {
    const tail = head - d * len * Math.min(1, grow * 1.5), n = 10;
    for (let i = 0; i < n; i++) { const k0 = i / n, k1 = (i + 1) / n; c.globalAlpha = fade * k1; c.strokeStyle = i > n - 3 ? TEAL : DARK; c.lineWidth = w * (0.4 + k1 * 0.6); c.beginPath(); c.moveTo(...at(x, y, tail + (head - tail) * k0, r)); c.lineTo(...at(x, y, tail + (head - tail) * k1, r)); c.stroke(); }
  });
  c.restore();
}
function dashes(c, x, y, R, a, d, t) {
  const { grow } = frameOf(t), start = a - d * SPAN, n = 9;
  c.save();
  for (let i = 0; i < n; i++) {
    const k = i / (n - 1), born = k * SWEEP, age = t - born; if (age < 0) continue;
    const life = 1 - age / 0.5; if (life <= 0) continue;
    const ang = start + d * 2 * SPAN * k, [px, py] = at(x, y, ang, R * 0.9), s = 7 * life;
    c.save(); c.translate(px, py); c.rotate(ang); c.fillStyle = i % 2 ? TEAL : DARK; c.globalAlpha = Math.min(1, life * 1.5); c.fillRect(-s, -s * 0.4, s * 2, s * 0.8); c.restore();
  }
  c.restore();
}
const TIMES = [0.15, 0.35, 0.55, 0.8];
floor.onload = () => {
  document.getElementById('rows').innerHTML = `<div class="row"><div></div><div class="head">반복 재생</div>${TIMES.map((t, i) => `<div class="head">${['휘두르기 시작', '휘두르는 중', '끝까지', '사라지는 중'][i]}</div>`).join('')}</div>` +
    CONCEPTS.map(([name, desc], r) => `<div class="row"><div class="label"><b>${name}</b><span>${desc}</span></div><canvas id="live${r}" width="160" height="110"></canvas>${TIMES.map((_, i) => `<canvas id="c${r}-${i}" width="160" height="110"></canvas>`).join('')}</div>`).join('');
  CONCEPTS.forEach(([, , draw], r) => TIMES.forEach((t, i) => {
    const c = document.getElementById(`c${r}-${i}`).getContext('2d'); c.imageSmoothingEnabled = false;
    c.drawImage(floor, 0, 0, 160, 110);
    // Small player stand-in: the slash is centred on the feet, facing right.
    const x = 55, y = 62; c.fillStyle = '#57684e40'; c.beginPath(); c.ellipse(x, y, 7, 2.5, 0, 0, TAU); c.fill();
    c.fillStyle = '#e8d6a8'; c.beginPath(); c.arc(x, y - 22, 8, 0, TAU); c.fill(); c.fillStyle = '#4a4f5a'; c.fillRect(x - 6, y - 15, 12, 13); c.fillStyle = '#b8333a'; c.fillRect(x - 6, y - 16, 12, 3);
    draw(c, x, y - 6, 2.15 * 20 * 0.92 / 2, 0, 1, t);
  }));
  window.done = true;
  // Live previews: each swing plays over 0.3 s, as in the game, then a short pause.
  const scene = (c, r, t) => { c.imageSmoothingEnabled = false; c.drawImage(floor, 0, 0, 160, 110); const x = 55, y = 62; c.fillStyle = '#57684e40'; c.beginPath(); c.ellipse(x, y, 7, 2.5, 0, 0, TAU); c.fill(); c.fillStyle = '#e8d6a8'; c.beginPath(); c.arc(x, y - 22, 8, 0, TAU); c.fill(); c.fillStyle = '#4a4f5a'; c.fillRect(x - 6, y - 15, 12, 13); c.fillStyle = '#b8333a'; c.fillRect(x - 6, y - 16, 12, 3); if (t <= 1) CONCEPTS[r][2](c, x, y - 6, 2.15 * 20 * 0.92 / 2, 0, Math.floor(performance.now() / 900) % 2 ? -1 : 1, t); };
  const loop = now => { const t = (now % 900) / 300; CONCEPTS.forEach((_, r) => scene(document.getElementById(`live${r}`).getContext('2d'), r, t)); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
};
</script></body></html>
